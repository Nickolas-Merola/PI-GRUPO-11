<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro - MaqTemp</title>
    <link rel="stylesheet" href="simulador.css">
</head>
<body>
    <div class="tela">

        <!-- LADO AZUL -->
        <div class="lado-azul">
            <h1 class="logo">
                <img src="LogoGraphic.svg"  class="logo-img">
                <span class="logo-texto">Maq<span>Temp</span></span>
            </h1>

            <div class="lado-azul-rodape">
                <span class="tag">Simulador financeiro</span>
                <p>Esse simulador tem como objetivo ajudar você e sua empresa a tomar a decisão correta para o sucesso!</p>
                <p class="obs">Obs.: contratando nossos serviços de Monitoramento.</p>
            </div>
        </div>

        <!-- LADO BRANCO -->
        <div class="lado-branco">
            <div class="form-box">
                <h2>Quanto sua indústria deixa de perder com o MaqTemp</h2>
                <p class="subtitulo">Preencha os dados de manutenção da sua indústria.</p>

                <div class="campo">
                    <label for="ipt_paradasAno">Quantas vezes por ano os motores param por superaquecimento</label>
                    <input type="number" id="ipt_paradasAno" placeholder="Ex: 4" min="0">
                </div>

                <div class="campo">
                    <label for="ipt_custoReparo">Custo de um reparo (R$)</label>
                    <input type="number" id="ipt_custoReparo" placeholder="Ex: 1500" min="0">
                </div>

                <div class="campo">
                    <label for="ipt_diaCusto">Custo de um dia de máquina parada (R$)</label>
                    <input type="number" id="ipt_diaCusto" placeholder="Ex: 5000" min="0">
                </div>

                <button class="btn-principal" onclick="calcular()">Calcular impacto financeiro</button>

                <div id="div_exibir"></div>
            </div>
        </div>

    </div>

    <script>
        function calcular(){
            let paradasAno = Number(ipt_paradasAno.value);
            let custoReparo = Number(ipt_custoReparo.value);
            let diaCusto = Number(ipt_diaCusto.value);

            if (ipt_paradasAno.value == '' || ipt_custoReparo.value == '' || ipt_diaCusto.value == ''){
                // campos vazios
                div_exibir.innerHTML = '<div class="aviso">⚠ Preencha todos os campos para calcular.</div>';
            } else if (paradasAno < 0 || custoReparo < 0 || diaCusto < 0){
                // valores negativos
                div_exibir.innerHTML = '<div class="aviso">⚠ Não use valores negativos.</div>';
            } else {
                // cada falha deixa a máquina parada por 1 dia
                let diasParada = 1;

                // redução de custo com estratégias preditivas: 25% a 30%
                // aplicada à manutenção e também à produção parada
                let reducaoMinima = 25;
                let reducaoMaxima = 30;

                // prejuízo que o cliente teve com as paradas no ano
                let prejuizoParada = custoReparo + (diasParada * diaCusto);
                let prejuizoAno = prejuizoParada * paradasAno;

                // parte do prejuízo que vem da manutenção (reparos) e da produção parada
                let manutencaoAno = custoReparo * paradasAno;
                let producaoAno = diasParada * diaCusto * paradasAno;

                // economia com o monitoramento em cada parte
                let economiaManutMin = manutencaoAno * (reducaoMinima / 100);
                let economiaManutMax = manutencaoAno * (reducaoMaxima / 100);
                let economiaProdMin = producaoAno * (reducaoMinima / 100);
                let economiaProdMax = producaoAno * (reducaoMaxima / 100);

                // economia total
                let economiaTotalMin = economiaManutMin + economiaProdMin;
                let economiaTotalMax = economiaManutMax + economiaProdMax;

                // exibição do resultado
                div_exibir.innerHTML =
                    `<div class="resultado">
                        <b>Resultado da simulação</b> <br><br>
                        Sem o monitoramento, você perde por ano: <b style="color: #d32f2f;">R$ ${prejuizoAno.toFixed(2)}</b> <br><br>
                        Economia em manutenção por ano: <b style="color: #2e7d32;">R$ ${economiaManutMin.toFixed(2)} a R$ ${economiaManutMax.toFixed(2)}</b> <br>
                        Economia em produção por ano: <b style="color: #2e7d32;">R$ ${economiaProdMin.toFixed(2)} a R$ ${economiaProdMax.toFixed(2)}</b> <br><br>
                        Com o MaqTemp, você economiza por ano: <b style="color: #2e7d32;">R$ ${economiaTotalMin.toFixed(2)} a R$ ${economiaTotalMax.toFixed(2)}</b>
                    </div>`;
            }
        }
    </script>
</body>
</html>
