<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0B132B;
            color: #0B132B;
            margin: 0;
            padding: 20px;
        }

        .topo {
            background: #1C2541;
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-bottom: 4px solid #E87722;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topo b { color: #E87722; }

        select {
            background: #0B132B;
            color: white;
            border: 2px solid #E87722;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 15px;
        }

        .status {
            background: #1C2541;
            color: white;
            padding: 20px 25px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 8px solid #E87722;
        }

        .status h2 { color: #E87722; margin-top: 0; }

        .linha { display: flex; gap: 15px; margin-bottom: 15px; }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 15px;
            border-top: 4px solid #E87722;
        }

        .numero { font-size: 40px; font-weight: bold; color: #0B132B; }

        .verde    { color: #2f8a17; }
        .amarelo  { color: #c99600; }
        .vermelho { color: #d64545; }
        .cinza    { color: #999999; }
    </style>
</head>

<body>

    <!-- Cabeçalho com a seleção de motores -->
    <div class="topo">
        <div>
            <b>Graphics</b> |
            Atualizado às <span id="hora">--:--:--</span>
        </div>
        <select id="fMotor">
            <option value="0">Motor 1 (fictício)</option>
            <option value="1">Motor 2 (fictício)</option>
            <option value="2" selected>Motor 3 (sensor - analogico)</option>
        </select>
    </div>

    <!-- Faixa de status geral -->
    <div class="status">
        <h2 id="statusTitulo">Aguardando leitura do sensor...</h2>
        <span>✔ Normal: abaixo de 80 °C &nbsp;&nbsp; ⚠ Aviso: a partir de 80 °C &nbsp;&nbsp; ⛔ Emergência: acima de 90 °C</span>
    </div>

    <!-- Temperatura em tempo real do motor escolhido -->
    <div class="linha">
        <div class="card">
            <span id="nomeMotor">Motor 3</span>
            <div class="numero cinza" id="tempAtual">-- °C</div>
            <span id="faixaAtual">Sem leitura</span>
        </div>
    </div>

    <!-- KPIs -->
    <div class="linha">
        <div class="card">Temperatura máxima<div class="numero" id="kpiMaxima">-- °C</div></div>
        <div class="card">Temperatura média<div class="numero" id="kpiMedia">-- °C</div></div>
        <div class="card">Número de alertas<div class="numero" id="kpiAlertas">0</div></div>
        <div class="card">Tempo em zona de risco<div class="numero" id="kpiRisco">0%</div></div>
    </div>

    <!-- Gráfico -->
    <div class="card" style="height: 400px">
        <canvas id="sensorTemperatura"></canvas>
    </div>

    <script>
        var paginacao = {};
        var tempo = {};

        // ***** NOVO: os 3 motores. Os 2 primeiros são fictícios e o terceiro vem do sensor *****
        // Para o Motor 1 e o Motor 2, troque os valores de 'leitura' pelos que você quiser.
        var motores = [
            { nome: "Motor 1", origem: "ficticio", leitura: 72 },
            { nome: "Motor 2", origem: "ficticio", leitura: 84 },
            { nome: "Motor 3", origem: "sensor",   leitura: 0 }
        ];

        // Guarda as leituras de cada motor para calcular os KPIs
        var leituras = [[], [], []];
        var alertas = [0, 0, 0];
        var faixaAnterior = ["normal", "normal", "normal"];

        // ***** NOVO: o intervalo do eixo X. Mantive o limite de 10 leituras *****
        var MAX_PONTOS = 10;

        var motorAtual = 0; // começa no Motor 3, como está marcado no <select>

        var sensorTemperatura = new Chart(document.getElementById('sensorTemperatura').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperatura',
                        data: [],
                        borderColor: '#0B132B',
                        backgroundColor: 'rgba(232, 119, 34, 0.15)',
                        pointBackgroundColor: '#E87722',
                        fill: true,
                        tension: 0.3
                    },
                    {
                        label: 'Aviso (80 °C)',
                        data: [],
                        borderColor: '#f0b400',
                        borderDash: [6, 6],
                        pointRadius: 0
                    },
                    {
                        label: 'Emergência (90 °C)',
                        data: [],
                        borderColor: '#d64545',
                        borderDash: [6, 6],
                        pointRadius: 0
                    }
                ]
            },
            options: {
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { beginAtZero: true },
                    y: {
                        title: { display: true, text: 'Temperatura (°C)' },
                        beginAtZero: true,
                        min: 0,
                        max: 100
                    }
                }
            }
        });

        function atualizarTela(temp) {
            var faixa = 'normal';
            if (temp > 90) faixa = 'emergencia';
            else if (temp >= 80) faixa = 'aviso';

            // Conta alerta só quando entra numa faixa nova (item 8.6.3 do documento)
            if (faixa != 'normal' && faixa != faixaAnterior[motorAtual]) alertas[motorAtual]++;
            faixaAnterior[motorAtual] = faixa;

            var tempAtual = document.getElementById('tempAtual');
            tempAtual.innerText = temp.toFixed(1) + ' °C';
            if (faixa == 'normal') {
                tempAtual.className = 'numero verde';
                faixaAtual.innerText = '✔ Normal';
                statusTitulo.innerText = motores[motorAtual].nome + ' em operação normal';
            } else if (faixa == 'aviso') {
                tempAtual.className = 'numero amarelo';
                faixaAtual.innerText = '⚠ Aviso';
                statusTitulo.innerText = 'Atenção: ' + motores[motorAtual].nome + ' aquecendo';
            } else {
                tempAtual.className = 'numero vermelho';
                faixaAtual.innerText = '⛔ Emergência';
                statusTitulo.innerText = 'Emergência: ação imediata em ' + motores[motorAtual].nome + '!';
            }

            leituras[motorAtual].push(temp);
            var soma = 0, emRisco = 0;
            leituras[motorAtual].forEach(t => { soma += t; if (t >= 80) emRisco++; });

            kpiMaxima.innerText = Math.max(...leituras[motorAtual]).toFixed(1) + ' °C';
            kpiMedia.innerText = (soma / leituras[motorAtual].length).toFixed(1) + ' °C';
            kpiAlertas.innerText = alertas[motorAtual];
            kpiRisco.innerText = Math.round(emRisco / leituras[motorAtual].length * 100) + '%';

            hora.innerText = new Date().toLocaleTimeString('pt-BR');
        }

        // Coloca um ponto novo no gráfico (usado pelos 3 motores)
        function adicionarPonto(temp) {
            if (sensorTemperatura.data.labels.length >= MAX_PONTOS) {
                sensorTemperatura.data.labels.shift();
                sensorTemperatura.data.datasets.forEach(d => d.data.shift());
            }

            sensorTemperatura.data.labels.push(new Date().toLocaleTimeString('pt-BR'));
            sensorTemperatura.data.datasets[0].data.push(temp);
            sensorTemperatura.data.datasets[1].data.push(80);
            sensorTemperatura.data.datasets[2].data.push(90);

            sensorTemperatura.update();
        }

        // Desenha o motor escolhido no <select>, aproveitando as leituras já guardadas
        function trocarMotor() {
            motorAtual = parseInt(fMotor.value);
            var m = motores[motorAtual];

            nomeMotor.innerText = m.nome + (m.origem == 'sensor' ? ' (sensor)' : ' (fictício)');

            sensorTemperatura.data.labels = [];
            sensorTemperatura.data.datasets.forEach(d => d.data = []);

            leituras[motorAtual].forEach(t => {
                sensorTemperatura.data.labels.push('');
                sensorTemperatura.data.datasets[0].data.push(t);
                sensorTemperatura.data.datasets[1].data.push(80);
                sensorTemperatura.data.datasets[2].data.push(90);
            });

            sensorTemperatura.update();

            if (leituras[motorAtual].length > 0) {
                atualizarTela(leituras[motorAtual][leituras[motorAtual].length - 1]);
            } else {
                document.getElementById('tempAtual').innerText = '-- °C';
                document.getElementById('tempAtual').className = 'numero cinza';
                faixaAtual.innerText = 'Sem leitura';
                statusTitulo.innerText = 'Aguardando leitura do sensor...';
                kpiMaxima.innerText = '-- °C';
                kpiMedia.innerText = '-- °C';
                kpiAlertas.innerText = 0;
                kpiRisco.innerText = '0%';
            }
        }

        fMotor.onchange = trocarMotor;

        // ***** Igual ao original: a função obterDados lê o sensor *****
        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        var temp = parseFloat(valor);

                        // O Motor 3 é o único que vem do sensor
                        leituras[2].push(temp);

                        // Só joga no gráfico se o Motor 3 estiver selecionado
                        if (motorAtual == 2) {
                            var faixa = temp > 90 ? 'emergencia' : temp >= 80 ? 'aviso' : 'normal';
                            if (faixa != 'normal' && faixa != faixaAnterior[2]) alertas[2]++;
                            faixaAnterior[2] = faixa;
                            adicionarPonto(temp);
                            atualizarTela(temp);
                        }
                    });

                    grafico.update();
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        // Os motores fictícios recebem uma leitura nova a cada 3 segundos
        setInterval(() => {
            if (motorAtual == 2) return; // o Motor 3 usa o sensor, não o fictício

            var i = motorAtual;
            var base = motores[i].leitura;
            var variacao = (Math.random() * 8) - 4; // varia entre -4 e +4 °C
            var temp = Math.round((base + variacao) * 10) / 10;

            var faixa = temp > 90 ? 'emergencia' : temp >= 80 ? 'aviso' : 'normal';
            if (faixa != 'normal' && faixa != faixaAnterior[i]) alertas[i]++;
            faixaAnterior[i] = faixa;

            leituras[i].push(temp);
            adicionarPonto(temp);
            atualizarTela(temp);
        }, 3000);

        // Lê o sensor a cada 1 segundo, como no código original
        setInterval(() => {
            obterDados(sensorTemperatura, 'analogico');
        }, 2000);

        trocarMotor();

    </script>
</body>

</html>
