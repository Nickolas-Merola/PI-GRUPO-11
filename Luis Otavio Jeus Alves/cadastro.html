<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastro</h1>
    <label for="input_nome">Nome Completo</label> <br>
    <input type="text" id="input_nome" placeholder="Digite seu nome completo"> <br>

    <input type="text" id="input_email" placeholder="exemplo@suaempresa.com.br"><br>
    <label for="input_email">E-mail corporativo</label> <br>
    
    <label for="input_senha">Crie uma senha</label> <br>
    <input type="text" oninput="validarSenha()" id="input_senha" placeholder="No mínimo 8 caracteres"><br>

    <label for="input_senha">Confirme sua senha</label> <br>
    <input type="text" id="input_confirmarSenha" placeholder="Repita a senha criada:"><br>

    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_quantosCaracteres"></div>
    <div id="div_letraMaiuscula"></div>
    <div id="div_letraMinuscula"></div>
    <div id="div_charEspecial"></div>
</body>
</html>

<script>
    function validarSenha() {
        let senha = input_senha.value;
        let charEspeciais = ["!", "@", "#", "$", "%", "^", "&", "*", "(", ")", "-", "_", "=", "+", "[", "]", "{", "}", "|", ";",
        ":", "'", ",", ".", "<", ">", "/", "?", "`", "~"];
        let temCharEspecial = false;
        let temCaracteres = false;
        let temLetraMinuscula = false;
        let temLetraMaiuscula = false;
        let senhaTemSeguranca = false;


        if (senha.length >= 8) {
            div_quantosCaracteres.innerHTML = `Mínimo de 8 caractéres ✅`;
            temCaracteres = true;
        } else {
            div_quantosCaracteres.innerHTML = `Mínimo de 8 caractéres ❌`;
            temCaracteres = false;
        }

        if (senha != senha.toLowerCase()) {
            div_letraMaiuscula.innerHTML = `Contém letra maiúscula ✅`;
            temLetraMaiuscula = true;
        } else {
            div_letraMaiuscula.innerHTML = `Contém letra maiúscula ❌`;
            temLetraMaiuscula = false;
        }

        if (senha != senha.toUpperCase()) {
            div_letraMinuscula.innerHTML = `Contém letra minúscula ✅`;
            temLetraMinuscula = true;
        } else {
            div_letraMinuscula.innerHTML = `Contém letra minúscula ❌`;
            temLetraMinuscula = false;
        }

        for (let i = 0; i < charEspeciais.length; i++) {
            if (senha.includes(charEspeciais[i])) {
                temCharEspecial = true;
            }
        }

        if (temCharEspecial) {
            div_charEspecial.innerHTML = `Contém caractere especial ✅`;
        } else {
            div_charEspecial.innerHTML = `Contém caractere especial ❌`;
        }

        if (temCharEspecial && temCaracteres && temLetraMaiuscula && temLetraMinuscula) {
            senhaTemSeguranca == true;
        } else {
            senhaTemSeguranca == false;
        }

    }

    function validarEmail() {
        let email = input_email.value;

        if(!email.includes('@'))  {
            alert("O email precisa conter '@'")
        }

        if( !(email.endsWith('.com') || email.endsWith('.com.br')) ) {
            alert("Email inválido!");
        }

            if(email.indexOf('@') > email.indexOf('.com')) {
            alert("O '@' precisa vir antes do '.com'");
        }
    }

        function cadastrar() {
            let nomeCompleto = input_nome.value;
            let senha = input_senha.value;
            let confirmacaoSenha = input
            let email = input_email.value;

            if (nomeCompleto == "" || email == "" || senha == "" || confirmacaoSenha == "") {
                alert("Todos os campos precisam ser preenchidos!")
            } else {

                validarEmail();
            }
            
        }
    
</script>
