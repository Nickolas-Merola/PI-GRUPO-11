<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="stylelogin.css" />
  </head>
  <body class="fonte">
    <div>
      <img
        class="img"
        src="imgcad.jpg"
        alt=""
      />
      <div class="texto-sobre-imagem">
        <img src="icone_cores_fortes.png" alt="">
        <strong style="color: white">Maq</strong><strong style="color: orange">Temp</strong>
      </div>
    </div>
    <h1>Bem vindo de volta!</h1>
      <h5 class="h5">
        Acesse seu painel MaqTemp para gerenciar a telemetria e o estado das suas máquinas.
      </h5>
    <div>
      <span>Login:</span><br>
      <input
        class="input"
        placeholder="Informe o E-mail"
        type="text"
        id="ipt_email"
      /><br>
      <span>Informe sua senha:</span><br>
      <input
        class="input"
        placeholder="Insira sua senha"
        type="password"
        id="ipt_senha"
      /><br>
      <button onclick="entrar()" class="botao">Entrar na plataforma</button>
      <div id="div_mensagem"></div>
    </div>
    <script>
      function entrar() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;

        let emailCorreto = "admin@maqtemp.com";
        let senhaCorreta = "12345678";

        if (email == "" || senha == "") {
          div_mensagem.innerHTML = `<br>Preencha o e-mail e a senha`;
        } else if (email == emailCorreto && senha == senhaCorreta) {
          div_mensagem.innerHTML = `<br>Login realizado com sucesso!`;
        } else {
          div_mensagem.innerHTML = `<br>E-mail ou senha incorretos`;
        }
      }
    </script>
  </body>
</html>
